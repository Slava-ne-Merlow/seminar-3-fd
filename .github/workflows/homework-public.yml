name: Домашняя работа · Открытые тесты

on:
  pull_request:
    branches: [main]
    paths:
      - 'homework/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/scripts/summary.py'
      - '.github/workflows/homework-public.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homework-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Библиотека · Открытые тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Установить JDK 26
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '26'
      - name: Проверить решение
        id: tests
        run: |
          if bash ./gradlew :homework:cleanTest :homework:test --console=plain --no-daemon; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          fi
      - name: Показать результаты
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: python3 .github/scripts/summary.py homework
      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: homework-public-report
          path: |
            homework/build/reports/tests/test/
            homework/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7
